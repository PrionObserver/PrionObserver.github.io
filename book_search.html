    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const textarea = document.getElementById('book-titles-textarea');
            const generateButton = document.getElementById('generate-links-button');
            const resultsDiv = document.getElementById('search-results');
            const copyButtonsArea = document.getElementById('copy-buttons-area'); // New container for text and buttons
            const copyButtonsContainer = document.getElementById('copy-buttons-container'); // Container for buttons only

            // Define the search URLs - keeping the order consistent for button generation
            const searchUrls = {
                'Scholar': `https://scholar.google.com/scholar?q=`,
                'Archive': `https://archive.org/search?query=`,
                "Anna's": `https://annas-archive.org/search?q=`,
                'LibGen': `http://libgen.rs/search.php?req=`,
                'Sci-Hub': `https://sci-hub.st/https://scholar.google.com/scholar?q=`, // Sci-Hub often works best with a Scholar URL
                'Audio': `https://archive.org/search?query=`, // Base for Audio search
                'eBay': `https://www.ebay.com/sch/i.html?_nkw=`, // Base for eBay search
                'Amazon': `https://www.amazon.com/s?k=`, // Base for Amazon search
                'Audible': `https://www.audible.com/search?keywords=`, // Base for Audible search
                'LibriVox': `https://librivox.org/search?q=`, // Base for LibriVox search
                'Project Gutenberg': `https://www.gutenberg.org/ebooks/search/?query=`, // Base for Project Gutenberg search
                'Open Library': `https://openlibrary.org/search?q=`, // Base for Open Library search
                'ManyBooks': `https://manybooks.net/search/google?search=`, // Base for ManyBooks.net search
                'BookBub': `https://www.bookbub.com/search?search=`, // Base for BookBub search
                'Google Books': `https://books.google.com/books?q=` // Base for Google Books search
            };

             // Define URL suffixes for specific searches
             const urlSuffixes = {
                 'Audio': `&and%5B%5D=mediatype%3A%22audio%22`, // Suffix for Archive.org Audio search
                 'eBay': `&_sop=15` // Suffix for eBay lowest price sort
             };


            generateButton.addEventListener('click', () => {
                const lines = textarea.value.split('\n').map(line => line.trim()); // Get all lines, trim whitespace

                resultsDiv.innerHTML = ''; // Clear previous results
                copyButtonsContainer.innerHTML = ''; // Clear previous copy buttons

                const bookTitles = lines.filter(line => line.length > 0 && !line.startsWith('---'));

                if (bookTitles.length === 0) {
                     resultsDiv.innerHTML = '<p class="text-center text-gray-400">Please enter book titles in the text area above.</p>';
                     return;
                 }

                // Generate book links
                lines.forEach(line => {
                    if (line.startsWith('---')) {
                        // If the line starts with '---', create a divider and heading
                        const divider = document.createElement('hr');
                        divider.classList.add('divider'); // Apply divider styling
                        resultsDiv.appendChild(divider);

                         const dividerText = line.substring(3).trim(); // Remove '---' and trim
                         if (dividerText.length > 0) {
                             const heading = document.createElement('h3'); // Use h3 for category titles
                             heading.classList.add('category-heading'); // Apply new category heading styling
                             heading.textContent = dividerText;
                             resultsDiv.appendChild(heading);
                         }

                    } else if (line.length > 0) {
                        // If it's not a divider and not empty, treat as a book title
                        const title = line;
                        const encodedTitle = encodeURIComponent(title);

                        // Create HTML elements for the book title and its links
                        const bookResultItem = document.createElement('div');
                        bookResultItem.classList.add('book-result-item'); // Use the new class

                        const titleElement = document.createElement('span'); // Changed to span for inline flex
                        titleElement.classList.add('book-title'); // Apply book title styling
                        titleElement.textContent = title;
                        bookResultItem.appendChild(titleElement);

                        const linksDiv = document.createElement('div');
                        linksDiv.classList.add('search-links'); // Apply class for styling

                        // Create and append the links as styled buttons
                        for (const [name, baseUrl] of Object.entries(searchUrls)) {
                            const link = document.createElement('a');
                            // Construct the full URL using the base and potential suffix
                            const fullUrl = baseUrl + encodedTitle + (urlSuffixes[name] || '');

                            link.href = fullUrl;
                            link.textContent = `[${name}]`; // Text inside the button
                            link.target = '_blank'; // Open link in a new tab
                             // Add a data attribute to identify the site for copying
                            link.dataset.site = name;
                             // Add class for general link styling
                            link.classList.add('text-sm', 'hover:text-ffffff', 'no-underline', 'hover:underline', 'px-2', 'py-1', 'border', 'rounded', 'inline-block', 'transition', 'duration-200', 'ease-in-out', 'mr-0.5', 'font-medium', 'text-shadow'); /* Combined and refined classes */

                            linksDiv.appendChild(link);
                        }

                        bookResultItem.appendChild(linksDiv);
                        resultsDiv.appendChild(bookResultItem);
                    }
                    // Ignore empty lines that don't start with '---'
                });

                // Generate copy buttons after generating results
                 for (const siteName of Object.keys(searchUrls)) {
                     const copyButton = document.createElement('button');
                     copyButton.classList.add('copy-button');
                     copyButton.textContent = siteName; // Just the site name as button text
                     copyButton.dataset.site = siteName; // Store the site name in a data attribute

                     copyButton.addEventListener('click', async () => {
                         const siteToCopy = copyButton.dataset.site;
                         const urlsToCopy = [];
                         const bookItems = resultsDiv.querySelectorAll('.book-result-item');

                         bookItems.forEach(item => {
                             const link = item.querySelector(`.search-links a[data-site="${siteToCopy}"]`);
                             if (link && link.href) {
                                 urlsToCopy.push(link.href);
                             }
                         });

                         if (urlsToCopy.length > 0) {
                             try {
                                 await navigator.clipboard.writeText(urlsToCopy.join('\n'));
                                 const originalText = copyButton.textContent;
                                 copyButton.textContent = `Copied!`; // Shorter feedback
                                  // Temporarily change background color on success
                                 const originalBg = copyButton.style.backgroundColor;
                                 const originalBorder = copyButton.style.borderColor;
                                 copyButton.style.backgroundColor = 'rgba(76, 175, 80, 0.5)'; /* Greenish for success */
                                 copyButton.style.borderColor = 'rgba(76, 175, 80, 0.7)';


                                 setTimeout(() => {
                                     copyButton.textContent = originalText;
                                      copyButton.style.backgroundColor = originalBg; // Revert background
                                      copyButton.style.borderColor = originalBorder; // Revert border
                                 }, 1500); // Revert text and color after 1.5 seconds
                             } catch (err) {
                                 console.error('Failed to copy URLs: ', err);
                                  const originalText = copyButton.textContent;
                                  copyButton.textContent = `Failed!`; // Feedback on failure
                                   // Temporarily change background color on failure
                                  const originalBg = copyButton.style.backgroundColor;
                                  const originalBorder = copyButton.style.borderColor;
                                  copyButton.style.backgroundColor = 'rgba(244, 67, 54, 0.5)'; /* Reddish for failure */
                                  copyButton.style.borderColor = 'rgba(244, 67, 54, 0.7)';

                                 setTimeout(() => {
                                      copyButton.textContent = originalText;
                                      copyButton.style.backgroundColor = originalBg; // Revert background
                                      copyButton.style.borderColor = originalBorder; // Revert border
                                 }, 2000); // Revert text and color after 2 seconds
                             }
                         } else {
                             alert(`No ${siteToCopy} links found to copy.`);
                         }
                     });

                     copyButtonsContainer.appendChild(copyButton);
                 }

            });
        });
    </script>

</body>
